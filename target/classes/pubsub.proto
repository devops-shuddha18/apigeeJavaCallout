syntax = "proto3";

package pubsub;

option java_package = "pubsub";
option java_multiple_files = true;

service PubSubService {
  rpc GetTopic(GetTopicRequest) returns (GetTopicResponse);
}

message GetTopicRequest {
  string topic_name = 1;
}

message GetTopicResponse {
  string schema_id = 1;
  string topic_name = 2;
  string can_publish = 3;
  string rpc_id = 4;
}
